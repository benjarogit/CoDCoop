name: CoDCoop development gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-launcher.txt
      - run: python -m pip install -r tools/requirements-launcher.txt
      - name: Source, real UDP party and offscreen GUI contracts (no gameplay certification)
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v
  engine-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - run: ./build.sh
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_suite_protocol.cpp -o build/test_suite_protocol && ./build/test_suite_protocol
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_anim_fragments.cpp -o build/test_anim_fragments && ./build/test_anim_fragments
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_cinematics.cpp -o build/test_cinematics && ./build/test_cinematics
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_patch_ownership.cpp -o build/test_patch_ownership && ./build/test_patch_ownership
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_pregame_gate.cpp -o build/test_pregame_gate && ./build/test_pregame_gate
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_host_rules.cpp -o build/test_host_rules && ./build/test_host_rules
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_archive_rules.cpp -o build/test_archive_rules && ./build/test_archive_rules
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_reload_delivery.cpp -o build/test_reload_delivery && ./build/test_reload_delivery
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_qa_renderer_preload.cpp -o build/test_qa_renderer_preload && ./build/test_qa_renderer_preload
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_qa_deferred_models.cpp -o build/test_qa_deferred_models && ./build/test_qa_deferred_models
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_tree_ownership.cpp -o build/test_tree_ownership && ./build/test_tree_ownership
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_mt_epoch.cpp -o build/test_mt_epoch && ./build/test_mt_epoch
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_qa_dobj_mapping_barrier.cpp -o build/test_qa_dobj_mapping_barrier && ./build/test_qa_dobj_mapping_barrier
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_world_wire.cpp -o build/test_world_wire && ./build/test_world_wire
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_host_body_ownership.cpp -o build/test_host_body_ownership && ./build/test_host_body_ownership
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_host_body_policy.cpp -o build/test_host_body_policy && ./build/test_host_body_policy
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_peer_inventory.cpp -o build/test_peer_inventory && ./build/test_peer_inventory
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_peer_pose.cpp -o build/test_peer_pose && ./build/test_peer_pose
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_party_native_bridge.cpp -o build/test_party_native_bridge && ./build/test_party_native_bridge
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_peer_vitals.cpp -o build/test_peer_vitals && ./build/test_peer_vitals
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_save_provenance.cpp -o build/test_save_provenance && ./build/test_save_provenance
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_spawn_ticket.cpp -o build/test_spawn_ticket && ./build/test_spawn_ticket
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_weapon_selection.cpp -o build/test_weapon_selection && ./build/test_weapon_selection
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_asset_bootstrap.cpp -o build/test_asset_bootstrap && ./build/test_asset_bootstrap
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_resource_bootstrap_state.cpp -o build/test_resource_bootstrap_state && ./build/test_resource_bootstrap_state
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_resource_mapping_barrier.cpp -o build/test_resource_mapping_barrier && ./build/test_resource_mapping_barrier
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_inventory_preservation.cpp -o build/test_inventory_preservation && ./build/test_inventory_preservation
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_saved_remote_patch.cpp -o build/test_saved_remote_patch && ./build/test_saved_remote_patch
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_actor_eligibility.cpp -o build/test_actor_eligibility && ./build/test_actor_eligibility
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_input_frame_clock.cpp -o build/test_input_frame_clock && ./build/test_input_frame_clock
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_saved_ghost_cleanup.cpp -o build/test_saved_ghost_cleanup && ./build/test_saved_ghost_cleanup
      - run: g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined tests/test_near_body_draw.cpp -o build/test_near_body_draw && ./build/test_near_body_draw
      - run: i686-w64-mingw32-g++ -std=c++17 -O2 -static tests/test_dobj_free_abi.cpp -o build/test-dobj-abi.exe
      - run: i686-w64-mingw32-g++ -std=c++17 -O2 -static tests/test_mt_epoch_hook.cpp -o build/test-mt-epoch.exe
      - run: i686-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror -O2 -static tests/test_asset_bootstrap.cpp -o build/test-asset-bootstrap.exe
      - run: i686-w64-mingw32-g++ -std=c++17 -O2 -s -static -municode -Wl,--no-insert-timestamp tests/native_download_probe.cpp -o build/native-download-probe.exe -lole32 -lshell32 -lurlmon -lcomctl32 -loleaut32 -luuid -ladvapi32
      - name: Upload development binaries (not a gameplay certification)
        uses: actions/upload-artifact@v4
        with:
          name: development-engine-binaries
          path: |
            build/ddraw.dll
            build/codcoop_core.dll
            build/suite-check.exe
            build/test-dobj-abi.exe
            build/test-mt-epoch.exe
            build/test-asset-bootstrap.exe
            build/native-download-probe.exe
  native-checker-windows:
    needs: engine-build
    runs-on: windows-2022
    env:
      COOP_NATIVE_CHECKER: build/suite-check.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: development-engine-binaries
          path: build
      - name: Native receipt interoperability (no game or Windows 10/11 certification)
        run: python -m unittest discover -s tests -p test_installer_native.py -v
      - name: Native 32-bit calling and hook fixtures (no game certification)
        run: |
          ./build/test-dobj-abi.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/test-mt-epoch.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/test-asset-bootstrap.exe
          exit $LASTEXITCODE
      - name: Native WinINet loopback fault/resume tests (no gameplay certification)
        env:
          COOP_NATIVE_DOWNLOAD_PROBE: build/native-download-probe.exe
        run: python -m unittest discover -s tests -p test_installer_http.py -v
